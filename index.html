<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- ✅ CORRECCIÓN CLAVE: Viewport para móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laboratorio de Física - UNAP</title>
    <style>
        /* Estilos para que la página de GitHub se vea bien */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Evita scroll en la página contenedora */
            background-color: #0a1f44; /* Color de fondo de respaldo */
        }
        /* ✅ CORRECCIÓN CLAVE: El iframe ahora ocupa toda la pantalla y permite la interacción táctil */
        #appIframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            /* ✅ CORRECCIÓN CLAVE: Fuerza a que el iframe reciba eventos táctiles */
            touch-action: auto;
            /* ✅ CORRECCIÓN CLAVE: Mejora el rendimiento en móviles */
            -webkit-overflow-scrolling: touch;
            overflow-y: auto;
        }
        /* Un mensaje de carga por si la app tarda */
        .loading-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="loading-message">
        <p>Cargando aplicación...</p>
    </div>

    <!-- ✅ CORRECCIÓN CLAVE: El iframe con todas las propiedades necesarias -->
    <iframe id="appIframe"
            src="https://script.google.com/macros/s/AKfycbxwiiPHA9XgcmONKwZCZo5MbA85XRQanbzFKHtREH0OKFqARoWtyFctmMJq2kkEW6sX/exec"
            allow="geolocation; microphone; camera; midi; encrypted-media"
            allowfullscreen="true">
    </iframe>
</body>
</html>
